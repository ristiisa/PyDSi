name: Build Wheels

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-wheels:
    name: "${{ matrix.runs-on }} • ${{ matrix.arch }}"
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # manylinux + musllinux for each Linux arch
          - runs-on: ubuntu-latest
            arch: x86_64
          - runs-on: ubuntu-24.04-arm
            arch: aarch64
          - runs-on: macos-15-intel
            arch: x86_64
          - runs-on: macos-15
            arch: arm64
          - runs-on: windows-latest
            arch: AMD64
    runs-on: ${{ matrix.runs-on }}

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: 'recursive'

    # The melonDS core is most of the build time; keep its objects in ccache between runs.
    # Linux wheels build inside containers that see the runner's filesystem under /host.
    - name: Restore ccache
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/.ccache
        key: ccache-${{ matrix.runs-on }}-${{ matrix.arch }}-${{ hashFiles('.gitmodules', 'CMakeLists.txt') }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ matrix.runs-on }}-${{ matrix.arch }}-${{ hashFiles('.gitmodules', 'CMakeLists.txt') }}-
          ccache-${{ matrix.runs-on }}-${{ matrix.arch }}-

    - name: Install ccache (macOS)
      if: runner.os == 'macOS'
      run: brew install ccache

    - name: Install ccache (Windows)
      if: runner.os == 'Windows'
      run: choco install ccache --no-progress

    # melonDS doesn't compile with cl.exe. Use llvm-mingw's UCRT toolchain, the configuration tested
    # locally (53/53 tests): same C runtime as CPython and no runtime DLLs to bundle.
    - name: Install llvm-mingw (Windows)
      if: runner.os == 'Windows'
      run: |
        curl -sSL -o "$RUNNER_TEMP/llvm-mingw.zip" https://github.com/mstorsjo/llvm-mingw/releases/download/20260922/llvm-mingw-20260922-ucrt-x86_64.zip
        7z x -y -o"$RUNNER_TEMP" "$RUNNER_TEMP/llvm-mingw.zip" > /dev/null
        echo "$RUNNER_TEMP\\llvm-mingw-20260922-ucrt-x86_64\\bin" >> "$GITHUB_PATH"

    - name: Build wheels
      uses: pypa/cibuildwheel@v4.0.0
      env:
        CIBW_ARCHS: "${{ matrix.arch }}"
        CIBW_BEFORE_ALL_LINUX: "(command -v apk && apk add ccache) || (dnf install -y epel-release && dnf install -y ccache) || yum install -y ccache || true"
        CIBW_ENVIRONMENT_LINUX: "CCACHE_DIR=/host${{ github.workspace }}/.ccache CMAKE_C_COMPILER_LAUNCHER=ccache CMAKE_CXX_COMPILER_LAUNCHER=ccache"
        CIBW_ENVIRONMENT_MACOS: "MACOSX_DEPLOYMENT_TARGET=11.0 CCACHE_DIR=${{ github.workspace }}/.ccache CMAKE_C_COMPILER_LAUNCHER=ccache CMAKE_CXX_COMPILER_LAUNCHER=ccache"
        CIBW_ENVIRONMENT_WINDOWS: "CC=clang CXX=clang++ CMAKE_GENERATOR=Ninja CCACHE_DIR='${{ github.workspace }}\\.ccache' CMAKE_C_COMPILER_LAUNCHER=ccache CMAKE_CXX_COMPILER_LAUNCHER=ccache"

    - name: Upload wheels
      uses: actions/upload-artifact@v7
      with:
        name: wheels-${{ matrix.runs-on }}-${{ matrix.arch }}
        path: ./wheelhouse/*.whl

  build-sdist:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: 'recursive'

    - name: Build sdist
      run: pipx run build --sdist

    - uses: actions/upload-artifact@v7
      with:
        name: sdist
        path: dist/*.tar.gz

  # Publishing is left disabled: no PyPI credentials are configured for this repository.
  # To enable it, set up trusted publishing for the project on PyPI and uncomment this job.
  # publish:
